[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbs2"
version = "0.1.0"
description = "Modular ham radio BBS for Linux AX.25 / KISS / AGWPE"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    # Async networking
    "pyserial-asyncio>=0.6",
    # Web interface
    "flask>=3.0",
    "flask-socketio>=5.3",
    # Database
    "aiosqlite>=0.19",
    # Auth
    "bcrypt>=4.1",
    # Config
    "pyyaml>=6.0",
    # Production WSGI (used with Flask-SocketIO threading mode)
    "simple-websocket>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Needed to run display-plugin unit tests locally (optional on the Pi)
    "Pillow>=10.0",
    "numpy>=1.24",
]
display = [
    # Required by the framebuffer display plugin (bbs/plugins/display/).
    # Install with:  pip install bbs2[display]
    # On Raspberry Pi OS you can also: sudo apt install python3-pil python3-numpy
    "Pillow>=10.0",
    "numpy>=1.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
bbs2 = "bbs.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bbs*", "server*"]

[tool.setuptools.package-data]
"bbs" = ["py.typed"]
